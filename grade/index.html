<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التصحيح الآلي — واعد</title>
<meta name="theme-color" content="#07277A">
<link rel="icon" href="../waed/rc-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: one narrow column of cards (phone first); exam view = tab strip + one panel. */
:root{
  --bg:#F4F6FB; --surface:#ffffff; --ink:#18231f; --muted:#5f6d68; --line:#E3E7F0;
  --accent:#07277A; --accent-soft:#e8ebfa; --mark:#22CC77;
  --good:#1f8a4c; --warn:#b7791f; --bad:#c2410c;
  --font:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1222; --surface:#131C31; --ink:#e6eeeb; --muted:#9aaba5; --line:#26314A;
  --accent:#8f9bff; --accent-soft:#1B2640; --mark:#f0a93b; --good:#4ade80; --warn:#fbbf24; --bad:#fb923c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1222; --surface:#131C31; --ink:#e6eeeb; --muted:#9aaba5; --line:#26314A;
  --accent:#8f9bff; --accent-soft:#1B2640; --mark:#f0a93b; --good:#4ade80; --warn:#fbbf24; --bad:#fb923c; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.brand{background:#07277A;color:#fff}
.brand .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand img{height:34px;width:auto;background:#fff;border-radius:6px;padding:2px 4px}
.brand .nm b{display:block;font-size:16px}.brand .nm span{font-size:12px;opacity:.85}
.brand a{margin-inline-start:auto;color:#fff;font-size:13px;text-decoration:none;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:5px 10px;white-space:nowrap}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
header.top h1{margin:0;font-size:22px;text-wrap:balance}
header.top .sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:17px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 160px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 140px}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:140px;direction:rtl}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#06231b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#06231b}}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn:focus-visible,.opt:focus-visible,.tab:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.muted{color:var(--muted)}
.small{font-size:13px}
.examlist{display:flex;flex-direction:column;gap:10px}
.exam-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:start;width:100%}
.exam-item:hover{border-color:var(--accent)}
.exam-item b{display:block;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:2px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-weight:500;white-space:nowrap}
.chip.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 14px}
.krow{display:flex;align-items:center;gap:6px}
.krow .n{width:24px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.opt{width:32px;height:32px;border-radius:50%;border:1.6px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0}
.opt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.right{box-shadow:0 0 0 3px var(--good) inset}
.formtabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.formtab{padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700}
.formtab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sheetprev{width:100%;max-width:420px;border:1px solid var(--line);border-radius:8px;background:#fff;display:block;margin:10px auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--bg);border-radius:12px;padding:10px 12px}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12.5px}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%}
.pill{display:inline-block;min-width:44px;text-align:center;border-radius:20px;padding:1px 8px;font-weight:700;font-size:13px}
.pill.g{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.b{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.scanbox{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center}
.scanbox input{display:none}
.overlay{width:100%;max-width:520px;border-radius:10px;display:block;margin:0 auto 10px}
.ansgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.ans{border:1px solid var(--line);border-radius:10px;padding:4px;text-align:center;cursor:pointer;background:var(--bg)}
.ans .q{font-size:11px;color:var(--muted)}
.ans .a{font-weight:700;font-size:16px}
.ans.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.ans.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.ans.flag{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.score{font-size:30px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13.5px}
.note.warn{background:color-mix(in srgb,var(--warn) 14%,transparent)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal .card{max-width:420px;width:100%}
.ltr{direction:ltr;unicode-bidi:isolate}
.cam{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column;color:#fff}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .guide{position:absolute;inset:7% 9%;border:2px dashed rgba(255,255,255,.55);border-radius:14px;pointer-events:none}
.cam .guide i{position:absolute;width:26px;height:26px;background:rgba(255,255,255,.75)}
.cam .guide i:nth-child(1){top:-2px;right:-2px}.cam .guide i:nth-child(2){top:-2px;left:-2px}.cam .guide i:nth-child(3){bottom:-2px;right:-2px}.cam .guide i:nth-child(4){bottom:-2px;left:-2px}
.cam.found .guide{border-color:#22CC77;border-style:solid}
.cam .bar{height:auto;overflow:visible;flex:none;min-width:0;border-radius:0;position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:linear-gradient(#000c,#0000)}
.cam .bar b{font-size:16px}.cam .bar .btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.35);color:#fff}
.cam .msg{position:relative;z-index:2;margin-top:auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(#0000,#000d);text-align:center}
.cam .msg .st{font-size:15px;opacity:.9}
.cam .res{display:inline-block;margin-top:8px;padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.12);font-size:15px}
.cam .res.ok{background:#1f8a4cE6}.cam .res.bad{background:#b7791fE6}
.cam .res .sc{font-size:26px;font-weight:700;display:block;font-variant-numeric:tabular-nums}
.keyup{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.pts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.ptin{width:64px!important;padding:5px 6px!important;text-align:center;direction:ltr}
.keygrid .ptin{margin-inline-start:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:9px 14px;cursor:pointer;font-weight:500}
.seg button.on{background:var(--accent);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="brand"><div class="in"><img src="../waed/rc-logo.png" alt="الهيئة الملكية للجبيل وينبع"><div class="nm"><b>واعد</b><span>خدمة التصحيح الآلي — ثانوية الدفي</span></div><a href="../waed/">بوابة واعد</a></div></div>
<div class="wrap" id="app"></div>
<div id="layer"></div>
<script>
"use strict";
/* ====================== constants & helpers ====================== */
const LET_AR = ["أ","ب","ج","د"], LET_EN = ["A","B","C","D"];
let LET = LET_AR;
const FORM_AR = ["أ","ب","ج","د","هـ","و"], FORM_EN = ["A","B","C","D","E","F"];
let FORM_LET = FORM_AR;
const isEn = ex => !!ex && ex.lang==="en";
function useLang(ex){ LET = isEn(ex)?LET_EN:LET_AR; FORM_LET = isEn(ex)?FORM_EN:FORM_AR; }
const MAXF = 6;
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function confirmBox(text, okLabel="تأكيد"){
  return new Promise(res=>{
    const L=$("#layer");
    L.innerHTML=`<div class="modal"><div class="card"><p>${esc(text)}</p><div class="row"><button class="btn danger" id="cOk">${esc(okLabel)}</button><button class="btn" id="cNo">إلغاء</button></div></div></div>`;
    $("#cOk").onclick=()=>{L.innerHTML="";res(true)}; $("#cNo").onclick=()=>{L.innerHTML="";res(false)};
  });
}

/* ====================== storage ====================== */
const Store = {
  mode:"local", exams:[], roster:{},
  async init(){
    try{
      const raw = localStorage.getItem("waed-grader");
      if(raw){ const o=JSON.parse(raw); this.exams=o.exams||[]; this.roster=o.roster||{}; }
    }catch(e){ this.mode="memory"; }
  },
  local(){ try{ localStorage.setItem("waed-grader", JSON.stringify({exams:this.exams, roster:this.roster})); }catch(e){ toast("تعذّر الحفظ على الجهاز، صدّر النتائج لملف Excel."); } },
  saveExam(){ this.local(); return Promise.resolve(); },
  async deleteExam(ex){ this.exams=this.exams.filter(e=>e.id!==ex.id); this.local(); },
  saveRoster(){ this.local(); return Promise.resolve(); }
};
/* school list: kept in a private Google Sheet; a teacher downloads it once with the school code and it stays on this device only */
const School = {
  KEY:"waed-grader-school", API:"https://script.google.com/macros/s/AKfycbz4ABnWXzuudzUtI46XwY-PYf7Qw7F37qWvDaJHiMyDN9sohvhj6-2zLETUiZbzBW62/exec", list:{}, updated:"", code:"",
  load(){ try{ const o=JSON.parse(localStorage.getItem(this.KEY)||"null"); if(o&&o.list){ this.list=o.list; this.updated=o.updated||""; this.code=o.code||""; } }catch(e){} },
  count(){ return Object.keys(this.list).length; },
  async fetch(code){
    const r=await fetch(this.API,{method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({code})});
    const j=await r.json(); if(!j.ok) throw new Error(j.error||"تعذّر تحميل القائمة");
    this.list=j.list||{}; this.updated=j.updated||""; this.code=code;
    try{ localStorage.setItem(this.KEY, JSON.stringify({list:this.list, updated:this.updated, code})); }catch(e){}
    return this.count();
  },
  clear(){ this.list={}; this.updated=""; this.code=""; try{ localStorage.removeItem(this.KEY); }catch(e){} }
};
/* the school list + the teacher's own additions (his own entries win) */
function student(id){ const r=Store.roster[id]; if(r) return typeof r==="string"?{name:r,cls:""}:r; const b=School.list[id]; return b?{name:b[0],cls:b[1]||""}:null; }
function sName(id){ const s=student(id); return s?s.name:""; }
function sCls(id){ const s=student(id); return s?s.cls:""; }
function withTimeout(p, ms){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),ms))]); }

/* ====================== exam model ====================== */
function newExam(o){
  const ex = {id:uid(), name:o.name||"اختبار جديد", subject:o.subject||"", lang:o.lang==="en"?"en":"ar", nq:o.nq||20, nopt:o.nopt||3, nforms:o.nforms||1, idDigits:o.idDigits||10, keys:[], results:[], created:Date.now()};
  fixKeys(ex); return ex;
}
function fixKeys(ex){
  ex.nq=Math.max(1,Math.min(40,ex.nq|0)); ex.nopt=ex.nopt==4?4:3; ex.nforms=Math.max(1,Math.min(MAXF,ex.nforms|0)); ex.idDigits=Math.max(3,Math.min(10,ex.idDigits|0));
  ex.keys = ex.keys||[];
  for(let f=0;f<MAXF;f++){ const k=ex.keys[f]||[]; ex.keys[f]=Array.from({length:ex.nq},(_,i)=> (k[i]!=null && k[i]<ex.nopt)?k[i]:-1); }
  ex.keys.length=MAXF;
  // points: one value for every question, or a value per question
  if(ex.ptsMode!=="each") ex.ptsMode="same";
  const same=+ex.ptsSame>0?+ex.ptsSame:1; ex.ptsSame=same;
  const q=ex.qpts||[]; ex.qpts=Array.from({length:ex.nq},(_,i)=>{ const v=+q[i]; return v>0?v:same; });
}
function qpt(ex,i){ return ex.ptsMode==="each" ? (ex.qpts[i]||0) : ex.ptsSame; }
function totalOf(ex){ let t=0; for(let i=0;i<ex.nq;i++) t+=qpt(ex,i); return rnd(t); }
function rnd(x){ return Math.round(x*100)/100; }
function rescore(ex){ ex.results.forEach(r=>{ r.score=scoreOf(ex,r.form,r.ans); }); }
function scoreOf(ex, form, ans){
  const key=ex.keys[form]||[]; let s=0;
  for(let i=0;i<ex.nq;i++) if(key[i]>=0 && ans[i]===key[i]) s+=qpt(ex,i);
  return rnd(s);
}
function keyComplete(ex, f){ return ex.keys[f].every(v=>v>=0); }

/* ====================== answer sheet layout (mm on A4) ====================== */
const SHEET = {W:210, H:297, fid:[[14,14],[196,14],[196,283],[14,283]], fidSize:9, orient:[28,14], orientSize:4.5,
  white:[[14,32],[196,32],[196,265],[14,265]]};
function layout(ex){
  const L = {id:[], form:[], q:[]}, en=isEn(ex);
  const n=ex.idDigits, x0 = en ? 210-(55+(n-1)*3.6) : 55-(n-1)*3.6;
  for(let c=0;c<n;c++){ const col=[]; for(let d=0;d<10;d++) col.push({x:x0+c*7.2, y:58+d*5.4, r:2.2}); L.id.push(col); }
  for(let f=0;f<ex.nforms;f++){ const b = ex.nforms<=4 ? {x:176-f*12, y:62, r:3.3} : {x:178-(f%3)*16, y:f<3?56:67, r:3.3}; if(en) b.x=210-b.x; L.form.push(b); }
  const cols = ex.nq>20?2:1, per = Math.ceil(ex.nq/cols);
  const sp = Math.min(7.4, per>1 ? 140/(per-1) : 7.4);
  for(let i=0;i<ex.nq;i++){
    const c=Math.floor(i/per), r=i%per;
    const numX = en ? (cols===1 ? 60 : (c===0?24:116)) : (cols===1 ? 150 : (c===0?186:94));
    const y=124+r*sp; const opts=[];
    for(let o=0;o<ex.nopt;o++) opts.push({x: en ? numX+12+o*11 : numX-12-o*11, y, r:3.2});
    L.q.push({numX, y, opts});
  }
  return L;
}

/* ====================== render the printable sheet ====================== */
async function renderSheet(ex, pxPerMm=11.811){
  useLang(ex); const en=isEn(ex), mx=x=>en?210-x:x;
  try{ await document.fonts.load('700 20px "IBM Plex Sans Arabic"'); await document.fonts.load('400 20px "IBM Plex Sans Arabic"'); }catch(e){}
  const k=pxPerMm, cv=document.createElement("canvas"); cv.width=Math.round(SHEET.W*k); cv.height=Math.round(SHEET.H*k);
  const g=cv.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,cv.width,cv.height);
  const F=(w,mm)=>`${w} ${mm*k}px "IBM Plex Sans Arabic", Tahoma, sans-serif`;
  g.fillStyle="#000";
  for(const [x,y] of SHEET.fid){ const s=SHEET.fidSize; g.fillRect((x-s/2)*k,(y-s/2)*k,s*k,s*k); }
  { const [x,y]=SHEET.orient, s=SHEET.orientSize; g.fillRect((x-s/2)*k,(y-s/2)*k,s*k,s*k); }
  g.direction="rtl"; g.textAlign="center"; g.textBaseline="middle";
  const logo=await loadLogo(); if(logo){ const lh=12, lw=lh*logo.width/logo.height; g.drawImage(logo,(186-lw)*k,8.5*k,lw*k,lh*k); }
  const hx=(logo?186-12*400/304-2:184)*k;
  if(en){ g.direction="ltr"; g.textAlign="right"; g.font=F(700,3.1); g.fillStyle="#07277A"; g.fillText("Royal Commission in Jubail",hx,11*k);
    g.font=F(500,2.8); g.fillStyle="#333"; g.fillText("Royal Commission Schools — Al-Dafi Secondary",hx,15.5*k);
    g.textAlign="left"; g.font=F(700,3.1); g.fillStyle="#07277A"; g.fillText("Waed Portal",38*k,11*k);
    g.font=F(500,2.8); g.fillStyle="#333"; g.fillText("Auto-Grading Service",38*k,15.5*k); }
  else{ g.textAlign="right"; g.font=F(700,3.1); g.fillStyle="#07277A"; g.fillText("الهيئة الملكية بالجبيل",hx,11*k);
  g.font=F(500,2.8); g.fillStyle="#333"; g.fillText("مدارس الهيئة الملكية — ثانوية الدفي",hx,15.5*k);
  g.textAlign="left"; g.font=F(700,3.1); g.fillStyle="#07277A"; g.fillText("بوابة واعد",38*k,11*k);
  g.font=F(500,2.8); g.fillStyle="#333"; g.fillText("خدمة التصحيح الآلي",38*k,15.5*k); }
  g.textAlign="center"; g.fillStyle="#000"; g.font=F(700,4.6); g.fillText(ex.name, 105*k, 22.5*k);
  g.font=F(500,3.1); g.fillStyle="#444";
  g.fillText(en ? "English   •   Answer Sheet   •   "+ex.nq+" Questions   •   Total "+totalOf(ex)
               : (ex.subject?"المادة: "+ex.subject+"   •   ":"")+"ورقة الإجابة   •   "+ex.nq+" سؤال   •   الدرجة "+totalOf(ex), 105*k, 27.3*k);

/* ====================== OMR: reading a photo ====================== */
const OMR = {
  toGray(img, maxSide=1600){
    const IW=img.videoWidth||img.width, IH=img.videoHeight||img.height;
    const s=Math.min(1, maxSide/Math.max(IW,IH));
    const w=Math.round(IW*s), h=Math.round(IH*s);
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h; const g=cv.getContext("2d");
    g.drawImage(img,0,0,w,h); const d=g.getImageData(0,0,w,h).data; const gray=new Uint8ClampedArray(w*h);
    for(let i=0,j=0;i<gray.length;i++,j+=4) gray[i]=(d[j]*299+d[j+1]*587+d[j+2]*114)/1000;
    return {gray,w,h,canvas:cv};
  },
  darkMask(G){
    const {gray,w,h}=G, I=new Float64Array((w+1)*(h+1));
    for(let y=0;y<h;y++){ let row=0; for(let x=0;x<w;x++){ row+=gray[y*w+x]; I[(y+1)*(w+1)+x+1]=I[y*(w+1)+x+1]+row; } }
    const R=Math.max(15,Math.round(Math.max(w,h)/12)), m=new Uint8Array(w*h);
    for(let y=0;y<h;y++){ const y0=Math.max(0,y-R), y1=Math.min(h,y+R+1);
      for(let x=0;x<w;x++){ const x0=Math.max(0,x-R), x1=Math.min(w,x+R+1);
        const sum=I[y1*(w+1)+x1]-I[y0*(w+1)+x1]-I[y1*(w+1)+x0]+I[y0*(w+1)+x0];
        const mean=sum/((x1-x0)*(y1-y0)); const v=gray[y*w+x];
        m[y*w+x] = (v<mean*0.62 && v<mean-30) ? 1 : 0; } }
    return m;
  },
  blobs(m,w,h){
    const lab=new Int32Array(w*h), out=[], stack=new Int32Array(w*h); let id=0;
    for(let p=0;p<w*h;p++){
      if(!m[p]||lab[p]) continue; id++; let sp=0; stack[sp++]=p; lab[p]=id;
      let n=0,sx=0,sy=0,minx=w,miny=h,maxx=0,maxy=0;
      while(sp){ const q=stack[--sp]; const x=q%w, y=(q/w)|0; n++; sx+=x; sy+=y;
        if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y;
        if(x>0&&m[q-1]&&!lab[q-1]){lab[q-1]=id;stack[sp++]=q-1;}
        if(x<w-1&&m[q+1]&&!lab[q+1]){lab[q+1]=id;stack[sp++]=q+1;}
        if(y>0&&m[q-w]&&!lab[q-w]){lab[q-w]=id;stack[sp++]=q-w;}
        if(y<h-1&&m[q+w]&&!lab[q+w]){lab[q+w]=id;stack[sp++]=q+w;} }
      const bw=maxx-minx+1, bh=maxy-miny+1;
      out.push({n,cx:sx/n,cy:sy/n,bw,bh,fill:n/(bw*bh)});
    }
    return out;
  },
  findCorners(G){
    const m=this.darkMask(G), all=this.blobs(m,G.w,G.h), N=G.w*G.h; this._blobs=all;
    const c=all.filter(b=>b.n>=40 && b.bw>=6 && b.bh>=6 && b.n<N*0.02 && b.bw/b.bh>0.5 && b.bw/b.bh<2 && b.fill>0.72)
      .sort((a,b)=>b.n-a.n).slice(0,14);
    const cands=[];
    for(let a=0;a<c.length;a++)for(let b=a+1;b<c.length;b++)for(let d=b+1;d<c.length;d++)for(let e=d+1;e<c.length;e++){
      const q=[c[a],c[b],c[d],c[e]]; const ns=q.map(t=>t.n); if(Math.max(...ns)/Math.min(...ns)>3.2) continue;
      const P=orderClockwise(q); if(!P) continue;
      const A=polyArea(P); if(A<N*0.04) continue;
      const side=[0,1,2,3].map(i=>Math.hypot(P[(i+1)%4].cx-P[i].cx,P[(i+1)%4].cy-P[i].cy));
      const r1=side[0]/side[2], r2=side[1]/side[3]; if(r1<0.6||r1>1.67||r2<0.6||r2>1.67) continue;
      const asp=(side[0]+side[2])/(side[1]+side[3]); if(!((asp>0.45&&asp<0.95)||(asp>1.05&&asp<2.2))) continue;
      // fiducial size must match ONE sheet (rejects a quad spanning two sheets printed on one page)
      const fr=Math.sqrt(ns.reduce((a,b)=>a+b,0)/4)/Math.min(...side); if(fr<0.03||fr>0.08) continue;
      const sc=A*Math.min(...ns)/Math.max(...ns);
      cands.push({sc,P});
    }
    return cands.sort((x,y)=>y.sc-x.sc).slice(0,30).map(x=>x.P);
  },
  read(img, ex, maxSide){
    const G=this.toGray(img, maxSide||1600); const cands=this.findCorners(G);
    // each candidate quad: try 4 rotations, keep the one whose orientation mark is dark,
    // and accept the quad only if that mark is clearly darker than the paper (a real single sheet)
    let H=null;
    for(const P of cands){
      let bestH=null, bestO=1e9;
      for(let r=0;r<4;r++){
        const dst=[0,1,2,3].map(i=>P[(i+r)%4]);
        const h=homography(SHEET.fid, dst.map(p=>[p.cx,p.cy]));
        const o=this.mean(G,h,SHEET.orient[0],SHEET.orient[1],1.4);
        if(o<bestO){bestO=o;bestH=h;}
      }
      const w=SHEET.white.reduce((t,[x,y])=>t+this.mean(G,bestH,x,y,3),0)/4;
      const kk=SHEET.fid.reduce((t,[x,y])=>t+this.mean(G,bestH,x,y,2.5),0)/4;
      const side=[[24,14],[14,24],[24,24],[105,14],[40,283],[105,283],[170,283],[14,100],[14,200],[196,100],[196,200]].map(([x,y])=>this.mean(G,bestH,x,y,1.2)); // blank margins must be light
      // the orientation mark must be its own small square blob exactly where this quad predicts it
      const [ox,oy]=applyH(bestH,SHEET.orient[0],SHEET.orient[1]), fn=P.reduce((t,q)=>t+q.n,0)/4, fs=Math.sqrt(fn);
      const om=this._blobs.find(q=>Math.hypot(q.cx-ox,q.cy-oy)<fs*0.45 && q.n>fn*0.1 && q.n<fn*0.5);
      if(om && w-bestO > 0.6*(w-kk) && Math.min(...side) > kk+0.55*(w-kk)){ H=bestH; break; }
    }
    if(!H) return {ok:false, reason:"corners", G};
    const W=SHEET.white.map(([x,y])=>this.mean(G,H,x,y,3));
    const B=SHEET.fid.map(([x,y])=>this.mean(G,H,x,y,2.5));
    const interp=(arr,x,y)=>{ const u=(x-14)/182, v=(y-14)/269; return (1-u)*(1-v)*arr[0]+u*(1-v)*arr[1]+u*v*arr[2]+(1-u)*v*arr[3]; };
    const fill=b=>{ const m=this.mean(G,H,b.x,b.y,b.r*0.62); const w=interp(W,b.x,b.y), k=interp(B,b.x,b.y); return Math.max(0,Math.min(1,(w-m)/Math.max(20,w-k))); };
    const L=layout(ex);
    const pick=scores=>{ const idx=scores.map((s,i)=>[s,i]).sort((a,b)=>b[0]-a[0]); const [t,ti]=idx[0], s2=idx[1]?idx[1][0]:0;
      if(t>=0.42){ if(s2>=0.42 && s2>t*0.72) return -2; return ti; }
      if(t>=0.26 && t-s2>=0.18) return ti; return -1; };
    const answers=L.q.map(q=>pick(q.opts.map(fill)));
    const qScores=L.q.map(q=>q.opts.map(fill));
    const idDigits=L.id.map(col=>{ const p=pick(col.map(fill)); return p>=0?String(p):"?"; });
    const form = ex.nforms>1 ? pick(L.form.map(fill)) : 0;
    return {ok:true, answers, qScores, id:idDigits.join(""), form, H, G, L};
  },
  mean(G,H,x,y,rad){
    let s=0,n=0; const st=rad/3;
    for(let dy=-rad;dy<=rad+1e-9;dy+=st) for(let dx=-rad;dx<=rad+1e-9;dx+=st){
      if(dx*dx+dy*dy>rad*rad) continue; const [u,v]=applyH(H,x+dx,y+dy);
      const xi=Math.round(u), yi=Math.round(v); if(xi<0||yi<0||xi>=G.w||yi>=G.h) continue; s+=G.gray[yi*G.w+xi]; n++; }
    return n?s/n:255;
  }
};
function orderClockwise(q){
  const cx=q.reduce((s,p)=>s+p.cx,0)/4, cy=q.reduce((s,p)=>s+p.cy,0)/4;
  const s=[...q].sort((a,b)=>Math.atan2(a.cy-cy,a.cx-cx)-Math.atan2(b.cy-cy,b.cx-cx)); // clockwise in image coords (y down)
  // start from the point closest to image top-left
  let k=0,bv=1e18; s.forEach((p,i)=>{const v=p.cx+p.cy; if(v<bv){bv=v;k=i;}});
  const P=[0,1,2,3].map(i=>s[(i+k)%4]);
  for(let i=0;i<4;i++){ const a=P[i],b=P[(i+1)%4],c=P[(i+2)%4]; const cr=(b.cx-a.cx)*(c.cy-b.cy)-(b.cy-a.cy)*(c.cx-b.cx); if(cr<=0) return null; }
  return P;
}
function polyArea(P){ let a=0; for(let i=0;i<4;i++){const p=P[i],q=P[(i+1)%4]; a+=p.cx*q.cy-q.cx*p.cy;} return Math.abs(a)/2; }
function homography(src,dst){
  const A=[],b=[];
  for(let i=0;i<4;i++){ const [x,y]=src[i],[u,v]=dst[i];
    A.push([x,y,1,0,0,0,-u*x,-u*y]); b.push(u); A.push([0,0,0,x,y,1,-v*x,-v*y]); b.push(v); }
  const h=solve(A,b); return [...h,1];
}
function solve(A,b){ const n=b.length; A=A.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<n;c++){ let p=c; for(let r=c+1;r<n;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r; [A[c],A[p]]=[A[p],A[c]];
    for(let r=0;r<n;r++){ if(r===c) continue; const f=A[r][c]/A[c][c]; for(let k=c;k<=n;k++) A[r][k]-=f*A[c][k]; } }
  return A.map((r,i)=>r[n]/r[i]); }
function applyH(H,x,y){ const w=H[6]*x+H[7]*y+H[8]; return [(H[0]*x+H[1]*y+H[2])/w,(H[3]*x+H[4]*y+H[5])/w]; }

function parseRosterRows(rows){
  const map={}; rows.forEach(cells=>{ cells=cells.map(c=>String(c??"").trim()).filter(Boolean);
    const idIdx=cells.findIndex(c=>/^[0-9٠-٩]{4,12}$/.test(c)); if(idIdx<0) return;
    const id=toLatinDigits(cells[idIdx]); const rest=cells.filter((_,i)=>i!==idIdx);
    const cls=rest.find(c=>/ثانوي|فصل|^[0-9]+\s*\/\s*[0-9]+$/.test(c))||"";
    const name=rest.filter(c=>c!==cls && /[\u0600-\u06FF]/.test(c)).sort((a,b)=>b.length-a.length)[0]||"";
    if(name) map[id]={name,cls}; });
  return map;
}

async function renderKey(ex, f, k){

  // cover the name line with a key banner
  g.fillStyle="#fff"; g.fillRect(18*k,29.5*k,176*k,7*k);
  g.fillStyle="#07277A"; g.font=F(700,4.2); g.textAlign="center"; g.textBaseline="middle"; g.direction="rtl";
  if(isEn(ex)){ g.direction="ltr"; g.fillText("Answer Key"+(ex.nforms>1?" — Form "+FORM_LET[f]:"")+"   •   Total "+totalOf(ex)+" marks", 105*k, 33.2*k); }

      g.fillStyle="#fff"; g.font=F(700,2.6); g.fillText(LET[a],b.x*k,(b.y+0.15)*k); g.fillStyle="#111"; }
    const last=q.opts[q.opts.length-1]; g.fillStyle="#07277A"; g.font=F(700,2.7); g.textAlign="center";
    g.fillText("("+qpt(ex,i)+")", (isEn(ex)?last.x+7.5:last.x-7.5)*k, q.y*k); g.fillStyle="#111"; });

/* sheet pages: one A4 portrait sheet, or two sheets side by side on A4 landscape (each = A5) */
async function sheetPage(ex, perPage, dpi){
  const mm=dpi/25.4;
  if(perPage===1) return {cv:await renderSheet(ex, mm), w:210, h:297};
  const s=148.5/210, one=await renderSheet(ex, mm*s);
  const cv=document.createElement("canvas"); cv.width=Math.round(297*mm); cv.height=Math.round(210*mm);
  const g=cv.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,cv.width,cv.height);
  const half=148.5*mm; g.drawImage(one,0,0,half,cv.height); g.drawImage(one,half,0,half,cv.height);
  g.strokeStyle="#999"; g.lineWidth=Math.max(1,0.25*mm); g.setLineDash([2*mm,1.6*mm]); g.beginPath(); g.moveTo(half,4*mm); g.lineTo(half,cv.height-4*mm); g.stroke();
  return {cv, w:297, h:210};
}
async function downloadSheetPdf(ex, perPage){

async function nextInQueue(){

    if(!res.ok){ toast("ما قدرت ألقى المربعات السوداء الأربعة. صوّر الورقة كاملة بإضاءة أوضح."); nextInQueue(); return; }
    const flags=res.answers.filter(a=>a<0).length;
    UI.review={answers:res.answers, id:res.id, form:res.form<0?0:res.form, formBad:res.form<0, flags, canvas:res.G.canvas, H:res.H, L:res.L};
  }catch(e){ toast("تعذّرت قراءة الصورة."); nextInQueue(); return; }

function drawOverlay(){

  const ex=UI.exam, key=ex.keys[R.form]||[], s=Math.hypot(...[0,1].map(i=>applyH(R.H,100,100)[i]-applyH(R.H,101,100)[i]));
  g.lineWidth=Math.max(2,s*0.6);
  R.L.q.forEach((q,i)=>{ q.opts.forEach((b,o)=>{ const [x,y]=applyH(R.H,b.x,b.y); const a=R.answers[i];
    if(o===a){ g.strokeStyle= key[i]===o?"#16a34a":"#dc2626"; g.beginPath(); g.arc(x,y,b.r*s*1.3,0,7); g.stroke(); }
    else if(o===key[i] && a!==o){ g.strokeStyle="#16a34a"; g.setLineDash([s,s*0.8]); g.beginPath(); g.arc(x,y,b.r*s*1.3,0,7); g.stroke(); g.setLineDash([]); } }); });
}

async function exportXlsx(){

  const rows=ex.results.slice().sort((a,b)=>a.sid.localeCompare(b.sid)).map(r=>{ const row=[r.sid, sName(r.sid), sCls(r.sid)]; if(ex.nforms>1) row.push(FORM_LET[r.form]);
    row.push(r.score, totalOf(ex), Math.round(r.score/totalOf(ex)*1000)/10); r.ans.forEach(a=>row.push(a>=0?LET[a]:"")); return row; });
  const wb=XLSX.utils.book_new(); wb.Workbook={Views:[{RTL:true}]};
  const ws=XLSX.utils.aoa_to_sheet([head,...rows]); ws["!cols"]=[{wch:13},{wch:28}]; XLSX.utils.book_append_sheet(wb,ws,"النتائج");
  const an=[["السؤال", ...(ex.nforms>1?FORM_LET.slice(0,ex.nforms).map(l=>"مفتاح "+l):["المفتاح"]), "عدد من أجاب صح","نسبة الإجابة الصحيحة %", ...LET.slice(0,ex.nopt), "فارغ"]];
  itemStats(ex,-1).forEach((t,i)=>an.push([i+1, ...ex.keys.slice(0,ex.nforms).map(k=>k[i]>=0?LET[k[i]]:""), t.right, Math.round(t.pct*10)/10, ...t.counts, t.blank]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(an),"تحليل الأسئلة");
  const kk=[["السؤال","الدرجة",...FORM_LET.slice(0,ex.nforms).map(l=>"نموذج "+l)]]; for(let i=0;i<ex.nq;i++) kk.push([i+1,qpt(ex,i),...ex.keys.slice(0,ex.nforms).map(k=>k[i]>=0?LET[k[i]]:"")]); kk.push(["المجموع",totalOf(ex)]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(kk),"مفتاح الإجابة");

  try{ await DL.save({filename:"نتائج - "+(ex.subject?ex.subject+" - ":"")+ex.name+".xlsx", data:new Blob([buf])}); }catch(e){ if(e&&e.code!=="declined") toast("تعذّر التصدير."); }
}

/* ====================== exam from a Word file: parse, shuffle into forms, export Word ====================== */
const WordX = {
  async lib(name){
    const src={mammoth:"https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js", docx:"https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"}[name];
    if(window[name]) return window[name];
    await new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src=src; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); });
    return window[name];
  },
  OPT_RE: /^\s*[\(\[]?\s*([أابجدa-dA-D])\s*[\)\]\-\.ـ:–]\s*([\s\S]*)$/,
  Q_RE: /^\s*(?:س\s*|سؤال\s*|Q\s*)?([0-9٠-٩]{1,3})\s*[\)\-\.ـ:–]\s*([\s\S]*)$/i,
  ANS_RE: /^\s*(?:الإجابة الصحيحة|الاجابة الصحيحة|الإجابة|الاجابة|الجواب|answer|ans|key)\s*[:：\-–]\s*\(?\s*([أابجدهـa-dA-D1-4١-٤])/i,
  FIXED_RE: /(كل|جميع)\s*ما\s*(سبق|ذكر)|لا\s*شيء|ليس\s*مما\s*سبق|غير\s*ذلك|all of the above|none of the above|both [a-d] and/i,
  letterIdx(ch){ const m={"أ":0,"ا":0,"ب":1,"ج":2,"د":3,"ه":4,"a":0,"b":1,"c":2,"d":3,"1":0,"2":1,"3":2,"4":3,"١":0,"٢":1,"٣":2,"٤":3}; const r=m[String(ch).toLowerCase()]; return r==null?-1:r; },
  /* flatten the Word HTML into lines, remembering list level and bold/underline */
  lines(root){
    const out=[];
    const mk=(el,level,list)=>{
      const c=el.cloneNode(true); c.querySelectorAll("ol,ul").forEach(x=>x.remove());
      const text=c.textContent.replace(/\s+/g," ").trim(), imgs=c.querySelectorAll("img").length;
      const len=t=>t.replace(/\s/g,"").length, total=len(text);
      const bold=total>0 && [...c.querySelectorAll("strong,b")].reduce((s,e)=>s+len(e.textContent),0)/total>0.8;
      const und=total>0 && [...c.querySelectorAll("u")].reduce((s,e)=>s+len(e.textContent),0)/total>0.8;
      if(total||imgs) out.push({el:c, text, imgs, level, list, bold, und});
    };
    const walk=(el,level)=>{
      for(const ch of el.children){
        const t=ch.tagName;
        if(t==="OL"||t==="UL"){ for(const li of ch.children){ if(li.tagName!=="LI") continue; mk(li,level,true); li.querySelectorAll(":scope > ol, :scope > ul").forEach(sub=>walk({children:[sub]},level+1)); } }
        else if(t==="TABLE"){ ch.querySelectorAll("td,th").forEach(td=>{ const ps=td.querySelectorAll("p"); if(ps.length) ps.forEach(p=>mk(p,0,false)); else mk(td,0,false); }); }
        else mk(ch,0,false);
      }
    };
    walk(root,0); return out;
  },
  /* split "أ- x  ب- y  ج- z" written on one line */
  splitInline(text){
    const re=/(?:^|\s)[\(\[]?([أابجدa-dA-D])\s*[\)\]\-\.ـ–]\s*/g; const hits=[]; let m;
    while((m=re.exec(text))) hits.push({i:m.index, j:re.lastIndex, l:m[1]});
    if(hits.length<2) return null;
    const exp=[0,1,2,3]; if(!hits.every((h,k)=>this.letterIdx(h.l)===exp[k])) return null;
    return hits.map((h,k)=>text.slice(h.j, k+1<hits.length?hits[k+1].i:text.length).trim());
  },
  parse(html){
    const root=document.createElement("div"); root.innerHTML=html;
    const Ls=this.lines(root), Q=[]; let cur=null;
    const newQ=(stemHtml,stemText)=>{ cur={stem:stemHtml, text:stemText, opts:[], ans:-1, ansLetter:null}; Q.push(cur); };
    const addOpt=(html,text,line)=>{ let t=text, star=false;
      if(/^\s*[\*✓✔]|[\*✓✔]\s*$/.test(t)){ star=true; t=t.replace(/^\s*[\*✓✔]\s*|\s*[\*✓✔]\s*$/g,""); html=html.replace(/[\*✓✔]/g,""); }
      cur.opts.push({html, text:t, star, bold:line?line.bold:false, und:line?line.und:false, fixed:this.FIXED_RE.test(t)}); };
    for(const L of Ls){
      let t=L.text; const lead=/^\s*[\*✓✔]\s*/.test(t); if(lead){ t=t.replace(/^\s*[\*✓✔]\s*/,""); L.text=t+" *"; }
      const a=t.match(this.ANS_RE);
      if(a && cur){ cur.ansLetter=a[1]; continue; }
      const om=t.match(this.OPT_RE), qm=t.match(this.Q_RE);
      if(cur && (om || (L.list && L.level>=1))){
        const inl=this.splitInline(t);
        if(inl && inl.length>=2){ inl.forEach(x=>addOpt(esc(x),x,null)); continue; }

const Share = {
  pack(ex){
    const k=ex.keys.slice(0,ex.nforms).map(a=>a.map(v=>v<0?"-":String(v)).join(""));
    const o={v:1,id:ex.id,n:ex.name,s:ex.subject||"",l:ex.lang||"ar",q:ex.nq,o:ex.nopt,f:ex.nforms,d:ex.idDigits,k,pm:ex.ptsMode,ps:ex.ptsSame};
    if(ex.ptsMode==="each") o.pq=ex.qpts;
    const b=new TextEncoder().encode(JSON.stringify(o)); let bin=""; b.forEach(c=>bin+=String.fromCharCode(c));
    return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  },
  unpack(str){
    const b=atob(str.replace(/-/g,"+").replace(/_/g,"/")); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i);

  },

      <p class="small muted" style="margin-top:10px">النتائج تنحفظ في الجهاز اللي صححت منه، فصدّرها لملف Excel منه. ولو عدّلت المفتاح هنا بعدين، افتح الرمز من جديد في الجوال.</p></div></div>`;
    $("#shClose").onclick=()=>{L.innerHTML="";};

  },

    Store.saveExam(ex); UI.exam=ex; UI.view="exam"; UI.tab="scan"; UI.form=0; UI.anForm=ex.nforms>1?-1:0;
    return true;
  }

/* ====================== import the answer key from a file ====================== */
function ansIndex(v){
  const t=String(v??"").trim().replace(/[()\.\s]/g,""); if(!t) return -1;
  const m={"أ":0,"ا":0,"إ":0,"ب":1,"ج":2,"د":3,"a":0,"b":1,"c":2,"d":3,"1":0,"2":1,"3":2,"4":3,"١":0,"٢":1,"٣":2,"٤":3};
  const r=m[t.toLowerCase()]; return r==null?-1:r;
}
function formIndex(h){ const t=String(h).replace(/نموذج|form|model|الإجابة|answer|key|مفتاح/gi,"").trim().replace(/[()\s]/g,"");
  if(!t) return null; let i=FORM_AR.indexOf(t); if(i<0) i=FORM_EN.indexOf(t.toUpperCase()); if(i<0 && /^[1-6]$/.test(t)) i=+t-1; if(i<0 && t==="ه") i=4; return i<0?null:i; }
function keyFromRows(ex, rows){
  rows=rows.map(r=>(r||[]).map(c=>String(c??"").trim()));
  let hi=rows.findIndex(r=>r.some(c=>/نموذج|form|model|الإجابة|answer|key|مفتاح/i.test(c)));
  const out={forms:{}, pts:null};
  let qCol=0, ptCol=-1, fCols=[];
  if(hi>=0){ const H=rows[hi];
    H.forEach((c,j)=>{ if(/السؤال|سؤال|question|رقم|^no\.?$|^q$/i.test(c)) qCol=j; else if(/الدرجة|درجة|points|marks|score/i.test(c)) ptCol=j;
      else if(/نموذج|form|model/i.test(c)){ const f=formIndex(c); if(f!=null) fCols.push([j,f]); }
      else if(/الإجابة|answer|key|مفتاح/i.test(c)) fCols.push([j,UI.form||0]); });
  } else { hi=-1; const w=Math.max(...rows.map(r=>r.length)); if(w<=2) fCols.push([1,Math.min(UI.form||0,ex.nforms-1)]); else for(let j=1;j<w;j++) fCols.push([j,j-1]); }
  if(!fCols.length) return null;
  const pts=[]; let any=false;
  rows.slice(hi+1).forEach(r=>{ const q=parseInt(toLatinDigits(r[qCol]||""),10); if(!(q>=1&&q<=ex.nq)) return;
    fCols.forEach(([j,f])=>{ if(f>=ex.nforms) return; const a=ansIndex(r[j]); if(a>=0&&a<ex.nopt){ (out.forms[f]=out.forms[f]||{})[q-1]=a; any=true; } });
    if(ptCol>=0){ const v=parseFloat(toLatinDigits(r[ptCol]||"")); if(v>=0) pts[q-1]=v; } });
  if(pts.length) out.pts=pts;
  return any?out:null;
}

}
async function pdfPages(file){
  const lib=await loadPdfJs(); const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise; const out=[];
  for(let i=1;i<=Math.min(doc.numPages,12);i++){ const pg=await doc.getPage(i); const vp=pg.getViewport({scale:2.2});
    const cv=document.createElement("canvas"); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height); await pg.render({canvasContext:cv.getContext("2d"), viewport:vp}).promise; out.push(cv); }
  return out;
}
async function importKey(files){
  const ex=UI.exam; if(!files.length) return; const msgs=[]; let changed=false;
  const applyForm=(f,arr,src)=>{ let n=0; for(let i=0;i<ex.nq;i++){ const a=arr[i]; if(a!=null&&a>=0&&a<ex.nopt){ ex.keys[f][i]=a; n++; } } if(n){ changed=true; msgs.push(`نموذج ${FORM_LET[f]}: ${n} من ${ex.nq}${src?" ("+src+")":""}`); } return n; };
  const fromImage=img=>{ const r=OMR.read(img, ex, 2000); if(!r.ok) return false;
    let f = ex.nforms>1 ? r.form : 0; if(f<0) f=Math.min(UI.form||0, ex.nforms-1);
    const blanks=r.answers.filter(a=>a<0).length; applyForm(f, r.answers, blanks?blanks+" سؤال غير واضح":"");
    return true; };
  toast("جاري قراءة الملف…");
  for(const file of files){
    try{
      if(/\.(xlsx|xls|csv)$/i.test(file.name)){
        if(!window.XLSX){ msgs.push("مكتبة Excel ما تحمّلت"); continue; }
        const wb=XLSX.read(await file.arrayBuffer(),{type:"array"}); let res=null;
        const names=wb.SheetNames.slice().sort((a,b)=>(/مفتاح|key/i.test(b)?1:0)-(/مفتاح|key/i.test(a)?1:0));
        for(const n of names){ res=keyFromRows(ex, XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false})); if(res) break; }
        if(!res){ msgs.push(file.name+": ما لقيت أعمدة الإجابات"); continue; }
        Object.entries(res.forms).forEach(([f,arr])=>applyForm(+f, Array.from({length:ex.nq},(_,i)=>arr[i]), ""));
        if(res.pts && res.pts.some(v=>v>=0)){ const same=res.pts.every(v=>v===res.pts[0]) && res.pts.length>=ex.nq;
          if(same){ ex.ptsMode="same"; ex.ptsSame=res.pts[0]; } else { ex.ptsMode="each"; ex.qpts=ex.qpts.map((v,i)=>res.pts[i]>=0?res.pts[i]:v); }
          changed=true; msgs.push("الدرجات: المجموع "+totalOf(ex)); }
      } else if(/\.pdf$/i.test(file.name) || file.type==="application/pdf"){
        const pages=await pdfPages(file); let ok=0; for(const cv of pages) if(fromImage(cv)) ok++;
        if(!ok) msgs.push(file.name+": ما لقيت فيه ورقة إجابة مظللة");
      } else {
        const img=await fileToImage(file); if(!fromImage(img)) msgs.push((file.name||"الصورة")+": ما قدرت ألقى المربعات السوداء الأربعة");
      }
    }catch(e){ msgs.push((file.name||"الملف")+": تعذّرت قراءته"); }
  }
  if(changed){ rescore(ex); Store.saveExam(ex); }
  render();
  const L=$("#layer"); L.innerHTML=`<div class="modal"><div class="card"><h2>${changed?"تمت قراءة الإجابات":"ما انقرأت إجابات"}</h2><p class="small">${msgs.map(esc).join("<br>")||"—"}</p><p class="small muted">راجع المفتاح وعدّل أي سؤال بالضغط عليه.</p><div class="row"><button class="btn pri" id="kOk">تمام</button></div></div></div>`;
  $("#kOk").onclick=()=>{L.innerHTML="";};
}

/* ====================== live camera (ZipGrade-style) ====================== */
const Live = {
  stream:null, timer:null, busy:false, last:null, hold:null, lostFrames:0, saved:0,
  async start(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast("الكاميرا المباشرة غير مدعومة في هذا المتصفح، استخدم تحميل الصور."); return; }
    const ex=UI.exam; this.saved=0; this.last=null; this.hold=null;
    try{ const A=window.AudioContext||window.webkitAudioContext; if(A&&!this.ac) this.ac=new A(); if(this.ac&&this.ac.resume) this.ac.resume(); }catch(e){}
    const L=$("#layer");
    L.innerHTML=`<div class="cam" id="cam"><video id="camV" playsinline muted autoplay></video><div class="guide"><i></i><i></i><i></i><i></i></div>
      <div class="bar"><div><b>${esc(ex.name)}</b><div class="small" id="camCount" style="opacity:.85">صُحّحت 0 ورقة</div></div><button class="btn" id="camClose">إنهاء</button></div>
      <div class="msg"><div class="st" id="camSt">جاري تشغيل الكاميرا…</div><div id="camRes"></div></div></div>`;
    $("#camClose").onclick=()=>this.stop(true);
    try{
      this.stream=await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1080}}});
    }catch(e){ this.stop(false);
      const L=$("#layer"); L.innerHTML=`<div class="modal"><div class="card"><h2>الكاميرا ما اشتغلت</h2>
        <p class="small">المتصفح ما قدر يطلب إذن الكاميرا. جرّب:</p>
        <ol class="small" style="padding-inline-start:18px;margin:6px 0">
          <li>اقفل الفقاعات العائمة (ماسنجر، واتساب، فلتر الشاشة، أو أي تطبيق يظهر فوق التطبيقات) وارجع جرّب.</li>
          <li>أو اضغط القفل 🔒 جنب الرابط فوق ← الأذونات ← الكاميرا ← سماح، وحدّث الصفحة.</li>
        </ol>
        <p class="small muted">وتقدر تصحح الحين بزر «تصوير ورقة» أو «تحميل صور الأوراق».</p>
        <div class="row"><button class="btn pri" id="camErrOk">تمام</button></div></div></div>`;
      $("#camErrOk").onclick=()=>{L.innerHTML="";}; return; }
    const v=$("#camV"); v.srcObject=this.stream; try{ await v.play(); }catch(e){}
    this.status("وجّه الكاميرا للورقة حتى تظهر المربعات السوداء الأربعة");
    this.loop();
  },
  stop(rerender){ clearTimeout(this.timer); this.timer=null; if(this.stream){ this.stream.getTracks().forEach(t=>t.stop()); this.stream=null; } $("#layer").innerHTML=""; if(rerender) render(); },
  status(t){ const e=$("#camSt"); if(e) e.textContent=t; },
  showRes(html, cls){ const e=$("#camRes"); if(e) e.innerHTML=html?`<div class="res ${cls||""}">${html}</div>`:""; },
  loop(){ this.timer=setTimeout(()=>this.tick(), 220); },
  tick(){
    const v=$("#camV"); if(!v||!this.stream) return;
    if(!v.videoWidth){ this.loop(); return; }
    const ex=UI.exam; let res=null;
    try{ res=OMR.read(v, ex, 1280); }catch(e){ res=null; }
    const cam=$("#cam"); if(cam) cam.classList.toggle("found", !!(res&&res.ok));
    if(!res||!res.ok){
      this.lostFrames++; this.last=null;
      if(this.lostFrames>=3 && this.hold){ this.hold=null; this.status("جاهز للورقة اللي بعدها"); }
      this.loop(); return;
    }
    this.lostFrames=0;
    const sig=res.id+"|"+res.form+"|"+res.answers.join(",");
    // same sheet still in front of the camera after it was saved: wait until it is removed
    if(this.hold && this.hold===res.id){ this.loop(); return; }
    if(this.last!==sig){ this.last=sig; this.status("ثبّت الجوال…"); this.loop(); return; }   // need two identical reads in a row
    const flags=res.answers.filter(a=>a<0).length, idBad=res.id.includes("?"), formBad=ex.nforms>1&&res.form<0;
    if(!idBad && !formBad && flags===0){
      const form=res.form<0?0:res.form, sc=scoreOf(ex,form,res.answers);
      ex.results=ex.results.filter(r=>r.sid!==res.id);
      ex.results.push({sid:res.id, form, ans:res.answers.slice(), score:sc, at:Date.now()}); Store.saveExam(ex);
      this.saved++; this.hold=res.id; this.last=null; this.beep(); if(navigator.vibrate) navigator.vibrate(80);
      const nm=sName(res.id);
      this.showRes(`<span class="sc">${sc} / ${totalOf(ex)}</span>${esc(nm||res.id)}${ex.nforms>1?" • نموذج "+FORM_LET[form]:""}`, "ok");
      const c=$("#camCount"); if(c) c.textContent="صُحّحت "+this.saved+" ورقة";
      this.status("تم الحفظ ✓ — شيل الورقة وحط اللي بعدها");
      this.loop(); return;
    }
    // unclear read: open it for review with the frame, then come back to the camera
    const snap=document.createElement("canvas"); snap.width=v.videoWidth; snap.height=v.videoHeight; snap.getContext("2d").drawImage(v,0,0);
    const r2=OMR.read(snap, ex, 1600); const R=r2.ok?r2:res;
    this.stop(false);
    UI.fromLive=true; UI.queue=[];
    UI.review={answers:R.answers, id:R.id, form:R.form<0?0:R.form, formBad:ex.nforms>1&&R.form<0, flags:R.answers.filter(a=>a<0).length, canvas:R.G.canvas, H:R.H, L:R.L};
    render(); toast("القراءة تحتاج مراجعة، صحّحها واحفظ وترجع الكاميرا");
  },
  beep(){ try{ if(!this.ac) return; const o=this.ac.createOscillator(), g=this.ac.createGain(); o.frequency.value=1250; g.gain.value=0.08; o.connect(g); g.connect(this.ac.destination); o.start(); o.stop(this.ac.currentTime+0.12); }catch(e){} }
};
