<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التصحيح الآلي — واعد</title>
<meta name="theme-color" content="#07277A">
<link rel="icon" href="../waed/rc-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: one narrow column of cards (phone first); exam view = tab strip + one panel. */
:root{
  --bg:#F4F6FB; --surface:#ffffff; --ink:#18231f; --muted:#5f6d68; --line:#E3E7F0;
  --accent:#07277A; --accent-soft:#e8ebfa; --mark:#22CC77;
  --good:#1f8a4c; --warn:#b7791f; --bad:#c2410c;
  --font:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1222; --surface:#131C31; --ink:#e6eeeb; --muted:#9aaba5; --line:#26314A;
  --accent:#8f9bff; --accent-soft:#1B2640; --mark:#f0a93b; --good:#4ade80; --warn:#fbbf24; --bad:#fb923c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1222; --surface:#131C31; --ink:#e6eeeb; --muted:#9aaba5; --line:#26314A;
  --accent:#8f9bff; --accent-soft:#1B2640; --mark:#f0a93b; --good:#4ade80; --warn:#fbbf24; --bad:#fb923c; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.brand{background:#07277A;color:#fff}
.brand .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand img{height:34px;width:auto;background:#fff;border-radius:6px;padding:2px 4px}
.brand .nm b{display:block;font-size:16px}.brand .nm span{font-size:12px;opacity:.85}
.brand a{margin-inline-start:auto;color:#fff;font-size:13px;text-decoration:none;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:5px 10px;white-space:nowrap}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
header.top h1{margin:0;font-size:22px;text-wrap:balance}
header.top .sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:17px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 160px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 140px}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:140px;direction:rtl}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#06231b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#06231b}}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn:focus-visible,.opt:focus-visible,.tab:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.muted{color:var(--muted)}
.small{font-size:13px}
.examlist{display:flex;flex-direction:column;gap:10px}
.exam-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:start;width:100%}
.exam-item:hover{border-color:var(--accent)}
.exam-item b{display:block;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:2px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-weight:500;white-space:nowrap}
.chip.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px}
.krow{display:flex;align-items:center;gap:6px}
.krow .n{width:24px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.opt{width:32px;height:32px;border-radius:50%;border:1.6px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0}
.opt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.right{box-shadow:0 0 0 3px var(--good) inset}
.formtabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.formtab{padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700}
.formtab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sheetprev{width:100%;max-width:420px;border:1px solid var(--line);border-radius:8px;background:#fff;display:block;margin:10px auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--bg);border-radius:12px;padding:10px 12px}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12.5px}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%}
.pill{display:inline-block;min-width:44px;text-align:center;border-radius:20px;padding:1px 8px;font-weight:700;font-size:13px}
.pill.g{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.b{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.scanbox{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center}
.scanbox input{display:none}
.overlay{width:100%;max-width:520px;border-radius:10px;display:block;margin:0 auto 10px}
.ansgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.ans{border:1px solid var(--line);border-radius:10px;padding:4px;text-align:center;cursor:pointer;background:var(--bg)}
.ans .q{font-size:11px;color:var(--muted)}
.ans .a{font-weight:700;font-size:16px}
.ans.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.ans.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.ans.flag{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.score{font-size:30px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13.5px}
.note.warn{background:color-mix(in srgb,var(--warn) 14%,transparent)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal .card{max-width:420px;width:100%}
.ltr{direction:ltr;unicode-bidi:isolate}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="brand"><div class="in"><img src="../waed/rc-logo.png" alt="الهيئة الملكية للجبيل وينبع"><div class="nm"><b>واعد</b><span>خدمة التصحيح الآلي — ثانوية الدفي</span></div><a href="../waed/">بوابة واعد</a></div></div>
<div class="wrap" id="app"></div>
<script src="students.js"></script>
<div id="layer"></div>
<script>
"use strict";
/* ====================== constants & helpers ====================== */
const LET = ["أ","ب","ج","د"];
const FORM_LET = ["أ","ب","ج","د"];
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function confirmBox(text, okLabel="تأكيد"){
  return new Promise(res=>{
    const L=$("#layer");
    L.innerHTML=`<div class="modal"><div class="card"><p>${esc(text)}</p><div class="row"><button class="btn danger" id="cOk">${esc(okLabel)}</button><button class="btn" id="cNo">إلغاء</button></div></div></div>`;
    $("#cOk").onclick=()=>{L.innerHTML="";res(true)}; $("#cNo").onclick=()=>{L.innerHTML="";res(false)};
  });
}

/* ====================== storage ====================== */
const Store = {
  mode:"local", exams:[], roster:{},
  async init(){
    try{
      const raw = localStorage.getItem("waed-grader");
      if(raw){ const o=JSON.parse(raw); this.exams=o.exams||[]; this.roster=o.roster||{}; }
    }catch(e){ this.mode="memory"; }
  },
  local(){ try{ localStorage.setItem("waed-grader", JSON.stringify({exams:this.exams, roster:this.roster})); }catch(e){ toast("تعذّر الحفظ على الجهاز، صدّر النتائج لملف Excel."); } },
  saveExam(){ this.local(); return Promise.resolve(); },
  async deleteExam(ex){ this.exams=this.exams.filter(e=>e.id!==ex.id); this.local(); },
  saveRoster(){ this.local(); return Promise.resolve(); }
};
/* built-in school list (students.js) + the teacher's own additions */
function student(id){ const r=Store.roster[id]; if(r) return typeof r==="string"?{name:r,cls:""}:r; const b=(window.DAFI_STUDENTS||{})[id]; return b?{name:b[0],cls:b[1]||""}:null; }
function sName(id){ const s=student(id); return s?s.name:""; }
function sCls(id){ const s=student(id); return s?s.cls:""; }
function withTimeout(p, ms){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),ms))]); }

/* ====================== exam model ====================== */
function newExam(o){
  const ex = {id:uid(), name:o.name||"اختبار جديد", nq:o.nq||20, nopt:o.nopt||3, nforms:o.nforms||1, idDigits:o.idDigits||10, keys:[], results:[], created:Date.now()};
  fixKeys(ex); return ex;
}
function fixKeys(ex){
  ex.nq=Math.max(1,Math.min(40,ex.nq|0)); ex.nopt=ex.nopt==4?4:3; ex.nforms=Math.max(1,Math.min(4,ex.nforms|0)); ex.idDigits=Math.max(3,Math.min(10,ex.idDigits|0));
  ex.keys = ex.keys||[];
  for(let f=0;f<4;f++){ const k=ex.keys[f]||[]; ex.keys[f]=Array.from({length:ex.nq},(_,i)=> (k[i]!=null && k[i]<ex.nopt)?k[i]:-1); }
  ex.keys.length=4;
}
function scoreOf(ex, form, ans){
  const key=ex.keys[form]||[]; let s=0;
  for(let i=0;i<ex.nq;i++) if(key[i]>=0 && ans[i]===key[i]) s++;
  return s;
}
function keyComplete(ex, f){ return ex.keys[f].every(v=>v>=0); }

/* ====================== answer sheet layout (mm on A4) ====================== */
const SHEET = {W:210, H:297, fid:[[14,14],[196,14],[196,283],[14,283]], fidSize:9, orient:[28,14], orientSize:4.5,
  white:[[14,32],[196,32],[196,265],[14,265]]};
function layout(ex){
  const L = {id:[], form:[], q:[]};
  const n=ex.idDigits, x0 = 55-(n-1)*3.6;
  for(let c=0;c<n;c++){ const col=[]; for(let d=0;d<10;d++) col.push({x:x0+c*7.2, y:58+d*5.4, r:2.2}); L.id.push(col); }
  for(let f=0;f<ex.nforms;f++) L.form.push({x:176-f*12, y:62, r:3.3});
  const cols = ex.nq>20?2:1, per = Math.ceil(ex.nq/cols);
  const sp = Math.min(7.4, per>1 ? 140/(per-1) : 7.4);
  for(let i=0;i<ex.nq;i++){
    const c=Math.floor(i/per), r=i%per;
    const numX = cols===1 ? 150 : (c===0?186:94);
    const y=124+r*sp; const opts=[];
    for(let o=0;o<ex.nopt;o++) opts.push({x:numX-12-o*11, y, r:3.2});
    L.q.push({numX, y, opts});
  }
  return L;
}

/* ====================== render the printable sheet ====================== */
async function renderSheet(ex, pxPerMm=11.811){
  try{ await document.fonts.load('700 20px "IBM Plex Sans Arabic"'); await document.fonts.load('400 20px "IBM Plex Sans Arabic"'); }catch(e){}
  const k=pxPerMm, cv=document.createElement("canvas"); cv.width=Math.round(SHEET.W*k); cv.height=Math.round(SHEET.H*k);
  const g=cv.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,cv.width,cv.height);
  const F=(w,mm)=>`${w} ${mm*k}px "IBM Plex Sans Arabic", Tahoma, sans-serif`;
  g.fillStyle="#000";
  for(const [x,y] of SHEET.fid){ const s=SHEET.fidSize; g.fillRect((x-s/2)*k,(y-s/2)*k,s*k,s*k); }
  { const [x,y]=SHEET.orient, s=SHEET.orientSize; g.fillRect((x-s/2)*k,(y-s/2)*k,s*k,s*k); }
  g.direction="rtl"; g.textAlign="center"; g.textBaseline="middle";
  const logo=await loadLogo(); if(logo){ const lh=12, lw=lh*logo.width/logo.height; g.drawImage(logo,(186-lw)*k,8.5*k,lw*k,lh*k); }
  g.textAlign="right"; g.font=F(700,3.1); g.fillStyle="#07277A"; g.fillText("الهيئة الملكية بالجبيل",(logo?186-12*400/304-2:184)*k,11*k);
  g.font=F(500,2.8); g.fillStyle="#333"; g.fillText("مدارس الهيئة الملكية — ثانوية الدفي",(logo?186-12*400/304-2:184)*k,15.5*k);
  g.textAlign="left"; g.font=F(700,3.1); g.fillStyle="#07277A"; g.fillText("بوابة واعد",38*k,11*k);
  g.font=F(500,2.8); g.fillStyle="#333"; g.fillText("خدمة التصحيح الآلي",38*k,15.5*k);
  g.textAlign="center"; g.fillStyle="#000"; g.font=F(700,4.6); g.fillText(ex.name, 105*k, 22.5*k);
  g.font=F(400,3); g.fillStyle="#555"; g.fillText("ورقة الإجابة   •   "+ex.nq+" سؤال", 105*k, 27*k);
  g.textAlign="right"; g.font=F(500,3.6); g.fillStyle="#000";
  g.fillText("اسم الطالب: ..................................................", 192*k, 33.5*k);
  g.textAlign="left"; g.fillText("الفصل: ..............", 20*k, 33.5*k);
  const L=layout(ex);
  // ID block
  const idL=L.id[0][0].x-5, idR=L.id[L.id.length-1][0].x+5;
  g.strokeStyle="#9aa"; g.lineWidth=0.3*k; roundRect(g,(idL)*k,38*k,(idR-idL)*k,76*k,2*k); g.stroke();
  g.textAlign="center"; g.font=F(700,3.4); g.fillStyle="#000"; g.fillText("رقم الطالب (ظلّل الرقم)", ((idL+idR)/2)*k, 42*k);
  g.lineWidth=0.25*k; g.strokeStyle="#777";
  L.id.forEach(col=>{ g.strokeRect((col[0].x-2.8)*k,46*k,5.6*k,6*k); col.forEach((b,d)=>bubble(g,k,b,String(d),2.3)); });
  // form block
  if(ex.nforms>1){
    g.strokeStyle="#9aa"; g.lineWidth=0.3*k; roundRect(g,128*k,38*k,64*k,34*k,2*k); g.stroke();
    g.fillStyle="#000"; g.font=F(700,3.6); g.textAlign="center"; g.fillText("رمز النموذج (ظلّل حرفًا واحدًا)",160*k,45*k);
    g.lineWidth=0.25*k; g.strokeStyle="#777";
    L.form.forEach((b,f)=>bubble(g,k,b,FORM_LET[f],3));
  }
  // instructions
  g.textAlign="right"; g.fillStyle="#333"; g.font=F(400,3.1);
  const ins=["• ظلّل الدائرة كاملة بقلم رصاص غامق.","• لا تكتب ولا تؤشر داخل المربعات السوداء.","• اختر إجابة واحدة فقط لكل سؤال."];
  ins.forEach((t,i)=>g.fillText(t,190*k,(ex.nforms>1?82:48)*k+i*6*k));
  // questions
  g.strokeStyle="#ccd"; g.lineWidth=0.25*k; g.beginPath(); g.moveTo(20*k,116*k); g.lineTo(190*k,116*k); g.stroke();
  L.q.forEach((q,i)=>{
    if(i%2===0){ g.fillStyle="#f2f4f3"; const x1=q.opts[q.opts.length-1].x-5, x2=q.numX+5; g.fillRect(x1*k,(q.y-3.6)*k,(x2-x1)*k,7.2*k); }
    g.fillStyle="#000"; g.font=F(700,3.6); g.textAlign="center"; g.fillText(String(i+1), q.numX*k, q.y*k);
    g.strokeStyle="#666"; g.lineWidth=0.25*k;
    q.opts.forEach((b,o)=>bubble(g,k,b,LET[o],3.4));
  });
  g.fillStyle="#888"; g.font=F(400,2.6); g.textAlign="center"; g.fillText("صوّر الورقة كاملة ومستوية بحيث تظهر المربعات السوداء الأربعة", 105*k, 290*k);
  return cv;
}
let _logo=null;
function loadLogo(){ if(_logo) return _logo; _logo=new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src="../waed/rc-logo.png"; }); return _logo; }
function bubble(g,k,b,label,fs){
  g.beginPath(); g.arc(b.x*k,b.y*k,b.r*k,0,Math.PI*2); g.fillStyle="#fff"; g.fill(); g.stroke();
  g.fillStyle="#b9bfbd"; g.font=`500 ${fs*0.62*k}px "IBM Plex Sans Arabic", Tahoma, sans-serif`; g.textAlign="center"; g.textBaseline="middle";
  g.fillText(label,b.x*k,b.y*k+0.15*k);
}
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

/* ====================== OMR: reading a photo ====================== */
const OMR = {
  toGray(img, maxSide=1600){
    const s=Math.min(1, maxSide/Math.max(img.width,img.height));
    const w=Math.round(img.width*s), h=Math.round(img.height*s);
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h; const g=cv.getContext("2d");
    g.drawImage(img,0,0,w,h); const d=g.getImageData(0,0,w,h).data; const gray=new Uint8ClampedArray(w*h);
    for(let i=0,j=0;i<gray.length;i++,j+=4) gray[i]=(d[j]*299+d[j+1]*587+d[j+2]*114)/1000;
    return {gray,w,h,canvas:cv};
  },
  darkMask(G){
    const {gray,w,h}=G, I=new Float64Array((w+1)*(h+1));
    for(let y=0;y<h;y++){ let row=0; for(let x=0;x<w;x++){ row+=gray[y*w+x]; I[(y+1)*(w+1)+x+1]=I[y*(w+1)+x+1]+row; } }
    const R=Math.max(15,Math.round(Math.max(w,h)/12)), m=new Uint8Array(w*h);
    for(let y=0;y<h;y++){ const y0=Math.max(0,y-R), y1=Math.min(h,y+R+1);
      for(let x=0;x<w;x++){ const x0=Math.max(0,x-R), x1=Math.min(w,x+R+1);
        const sum=I[y1*(w+1)+x1]-I[y0*(w+1)+x1]-I[y1*(w+1)+x0]+I[y0*(w+1)+x0];
        const mean=sum/((x1-x0)*(y1-y0)); const v=gray[y*w+x];
        m[y*w+x] = (v<mean*0.62 && v<mean-30) ? 1 : 0; } }
    return m;
  },
  blobs(m,w,h){
    const lab=new Int32Array(w*h), out=[], stack=new Int32Array(w*h); let id=0;
    for(let p=0;p<w*h;p++){
      if(!m[p]||lab[p]) continue; id++; let sp=0; stack[sp++]=p; lab[p]=id;
      let n=0,sx=0,sy=0,minx=w,miny=h,maxx=0,maxy=0;
      while(sp){ const q=stack[--sp]; const x=q%w, y=(q/w)|0; n++; sx+=x; sy+=y;
        if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y;
        if(x>0&&m[q-1]&&!lab[q-1]){lab[q-1]=id;stack[sp++]=q-1;}
        if(x<w-1&&m[q+1]&&!lab[q+1]){lab[q+1]=id;stack[sp++]=q+1;}
        if(y>0&&m[q-w]&&!lab[q-w]){lab[q-w]=id;stack[sp++]=q-w;}
        if(y<h-1&&m[q+w]&&!lab[q+w]){lab[q+w]=id;stack[sp++]=q+w;} }
      const bw=maxx-minx+1, bh=maxy-miny+1;
      out.push({n,cx:sx/n,cy:sy/n,bw,bh,fill:n/(bw*bh)});
    }
    return out;
  },
  findCorners(G){
    const m=this.darkMask(G), all=this.blobs(m,G.w,G.h), N=G.w*G.h;
    const c=all.filter(b=>b.n>=40 && b.bw>=6 && b.bh>=6 && b.n<N*0.02 && b.bw/b.bh>0.5 && b.bw/b.bh<2 && b.fill>0.72)
      .sort((a,b)=>b.n-a.n).slice(0,14);
    let best=null;
    for(let a=0;a<c.length;a++)for(let b=a+1;b<c.length;b++)for(let d=b+1;d<c.length;d++)for(let e=d+1;e<c.length;e++){
      const q=[c[a],c[b],c[d],c[e]]; const ns=q.map(t=>t.n); if(Math.max(...ns)/Math.min(...ns)>3.2) continue;
      const P=orderClockwise(q); if(!P) continue;
      const A=polyArea(P); if(A<N*0.04) continue;
      const side=[0,1,2,3].map(i=>Math.hypot(P[(i+1)%4].cx-P[i].cx,P[(i+1)%4].cy-P[i].cy));
      const r1=side[0]/side[2], r2=side[1]/side[3]; if(r1<0.6||r1>1.67||r2<0.6||r2>1.67) continue;
      const asp=(side[0]+side[2])/(side[1]+side[3]); if(!((asp>0.45&&asp<0.95)||(asp>1.05&&asp<2.2))) continue;
      const sc=A*Math.min(...ns)/Math.max(...ns);
      if(!best||sc>best.sc) best={sc,P};
    }
    return best?best.P:null;
  },
  read(img, ex){
    const G=this.toGray(img); const P=this.findCorners(G);
    if(!P) return {ok:false, reason:"corners", G};
    // try 4 rotations; pick the one where the orientation mark is dark
    let bestH=null, bestDark=-1;
    for(let r=0;r<4;r++){
      const dst=[0,1,2,3].map(i=>P[(i+r)%4]);
      const H=homography(SHEET.fid, dst.map(p=>[p.cx,p.cy]));
      const v=255-this.mean(G,H,SHEET.orient[0],SHEET.orient[1],1.4);
      if(v>bestDark){bestDark=v;bestH=H;}
    }
    const H=bestH;
    const W=SHEET.white.map(([x,y])=>this.mean(G,H,x,y,3));
    const B=SHEET.fid.map(([x,y])=>this.mean(G,H,x,y,2.5));
    const interp=(arr,x,y)=>{ const u=(x-14)/182, v=(y-14)/269; return (1-u)*(1-v)*arr[0]+u*(1-v)*arr[1]+u*v*arr[2]+(1-u)*v*arr[3]; };
    const fill=b=>{ const m=this.mean(G,H,b.x,b.y,b.r*0.62); const w=interp(W,b.x,b.y), k=interp(B,b.x,b.y); return Math.max(0,Math.min(1,(w-m)/Math.max(20,w-k))); };
    const L=layout(ex);
    const pick=scores=>{ const idx=scores.map((s,i)=>[s,i]).sort((a,b)=>b[0]-a[0]); const [t,ti]=idx[0], s2=idx[1]?idx[1][0]:0;
      if(t>=0.42){ if(s2>=0.42 && s2>t*0.72) return -2; return ti; }
      if(t>=0.26 && t-s2>=0.18) return ti; return -1; };
    const answers=L.q.map(q=>pick(q.opts.map(fill)));
    const qScores=L.q.map(q=>q.opts.map(fill));
    const idDigits=L.id.map(col=>{ const p=pick(col.map(fill)); return p>=0?String(p):"?"; });
    const form = ex.nforms>1 ? pick(L.form.map(fill)) : 0;
    return {ok:true, answers, qScores, id:idDigits.join(""), form, H, G, L};
  },
  mean(G,H,x,y,rad){
    let s=0,n=0; const st=rad/3;
    for(let dy=-rad;dy<=rad+1e-9;dy+=st) for(let dx=-rad;dx<=rad+1e-9;dx+=st){
      if(dx*dx+dy*dy>rad*rad) continue; const [u,v]=applyH(H,x+dx,y+dy);
      const xi=Math.round(u), yi=Math.round(v); if(xi<0||yi<0||xi>=G.w||yi>=G.h) continue; s+=G.gray[yi*G.w+xi]; n++; }
    return n?s/n:255;
  }
};
function orderClockwise(q){
  const cx=q.reduce((s,p)=>s+p.cx,0)/4, cy=q.reduce((s,p)=>s+p.cy,0)/4;
  const s=[...q].sort((a,b)=>Math.atan2(a.cy-cy,a.cx-cx)-Math.atan2(b.cy-cy,b.cx-cx)); // clockwise in image coords (y down)
  // start from the point closest to image top-left
  let k=0,bv=1e18; s.forEach((p,i)=>{const v=p.cx+p.cy; if(v<bv){bv=v;k=i;}});
  const P=[0,1,2,3].map(i=>s[(i+k)%4]);
  for(let i=0;i<4;i++){ const a=P[i],b=P[(i+1)%4],c=P[(i+2)%4]; const cr=(b.cx-a.cx)*(c.cy-b.cy)-(b.cy-a.cy)*(c.cx-b.cx); if(cr<=0) return null; }
  return P;
}
function polyArea(P){ let a=0; for(let i=0;i<4;i++){const p=P[i],q=P[(i+1)%4]; a+=p.cx*q.cy-q.cx*p.cy;} return Math.abs(a)/2; }
function homography(src,dst){
  const A=[],b=[];
  for(let i=0;i<4;i++){ const [x,y]=src[i],[u,v]=dst[i];
    A.push([x,y,1,0,0,0,-u*x,-u*y]); b.push(u); A.push([0,0,0,x,y,1,-v*x,-v*y]); b.push(v); }
  const h=solve(A,b); return [...h,1];
}
function solve(A,b){ const n=b.length; A=A.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<n;c++){ let p=c; for(let r=c+1;r<n;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r; [A[c],A[p]]=[A[p],A[c]];
    for(let r=0;r<n;r++){ if(r===c) continue; const f=A[r][c]/A[c][c]; for(let k=c;k<=n;k++) A[r][k]-=f*A[c][k]; } }
  return A.map((r,i)=>r[n]/r[i]); }
function applyH(H,x,y){ const w=H[6]*x+H[7]*y+H[8]; return [(H[0]*x+H[1]*y+H[2])/w,(H[3]*x+H[4]*y+H[5])/w]; }

  const rs=ex.results.filter(r=>f===-1||r.form===f);
  return Array.from({length:ex.nq},(_,i)=>{
    const counts=Array(ex.nopt).fill(0); let blank=0, right=0;
    rs.forEach(r=>{ const a=r.ans[i]; if(a>=0) counts[a]++; else blank++; if(ex.keys[r.form][i]>=0 && a===ex.keys[r.form][i]) right++; });
    return {counts, blank, right, n:rs.length, pct: rs.length? right/rs.length*100 : 0};
  });
}
function analysisHTML(){
  const ex=UI.exam, f=ex.nforms>1?UI.anForm:0, it=itemStats(ex,f);
  const n=it[0]?it[0].n:0;
  if(!ex.results.length) return `<div class="card"><h2>تحليل الأسئلة</h2><p class="muted">يظهر التحليل بعد تصحيح أول ورقة.</p></div>`;
  const hard=it.map((t,i)=>[t.pct,i]).filter(x=>x[0]<40).sort((a,b)=>a[0]-b[0]);
  return `<div class="card"><h2>تحليل الأسئلة</h2>${ex.nforms>1?formTabs(f,"data-an",true):""}
   <p class="small muted">${n} ورقة${f===-1&&ex.nforms>1?" من كل النماذج (السؤال بنفس رقمه في كل نموذج)":""}. ${hard.length?`أصعب الأسئلة: ${hard.slice(0,5).map(x=>x[1]+1).join("، ")}.`:"ما فيه سؤال نسبة إجابته الصحيحة أقل من 40%."}</p>
   <div class="tablewrap"><table><thead><tr><th>السؤال</th>${f>=0?"<th>الصحيحة</th>":""}<th>أجاب صح</th><th></th>${Array.from({length:ex.nopt},(_,o)=>`<th>${LET[o]}</th>`).join("")}<th>فارغ</th></tr></thead><tbody>
   ${it.map((t,i)=>{const p=Math.round(t.pct), col=p>=70?"var(--good)":p>=40?"var(--warn)":"var(--bad)", k=f>=0?ex.keys[f][i]:-1;
     return `<tr><td><b>${i+1}</b></td>${f>=0?`<td>${k>=0?LET[k]:"—"}</td>`:""}<td><span class="pill ${p>=70?"g":p>=40?"w":"b"}">${p}%</span></td><td><div class="bar"><i style="width:${p}%;background:${col}"></i></div></td>
     ${t.counts.map((c,o)=>`<td style="${o===k?"font-weight:700;color:var(--good)":""}">${c}</td>`).join("")}<td class="muted">${t.blank}</td></tr>`;}).join("")}
   </tbody></table></div></div>`;
}
function settingsHTML(){

    <div class="row"><label class="f" style="flex-basis:100%">اسم الاختبار<input type="text" id="sName" value="${esc(ex.name)}"></label></div>

    <label class="f">عدد النماذج<select id="sF">${[1,2,3,4].map(v=>`<option ${ex.nforms==v?"selected":""}>${v}</option>`).join("")}</select></label>

/* ---------- events ---------- */
function bind(){
  const on=(sel,ev,fn)=>{ const el=$(sel); if(el) el.addEventListener(ev,fn); };
  on("#goRoster","click",()=>{UI.view="roster";render();});
  on("#back","click",()=>{UI.view="home";UI.review=null;UI.queue=[];render();});
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{UI.exam=Store.exams.find(e=>e.id===b.dataset.open);UI.view="exam";UI.tab="key";UI.form=0;UI.anForm=UI.exam.nforms>1?-1:0;render();});
  on("#create","click",async()=>{
    const ex=newExam({name:$("#nName").value.trim()||"اختبار جديد", nq:+$("#nQ").value, nopt:+$("#nOpt").value, nforms:+$("#nF").value, idDigits:+$("#nD").value});
    Store.exams.push(ex); UI.exam=ex; UI.view="exam"; UI.tab="key"; UI.form=0; UI.anForm=ex.nforms>1?-1:0; render(); Store.saveExam(ex);
  });
  on("#saveRoster","click",()=>{
    const rows=$("#rosterTxt").value.split(/\n/).map(l=>l.split(/[,،;\t]+/));
    Store.roster=parseRosterRows(rows); Store.saveRoster(); toast("تم حفظ "+Object.keys(Store.roster).length+" طالب"); render();
  });
  on("#rosterFile","change",async e=>{ const f=e.target.files[0]; if(!f) return;
    if(!window.XLSX){ toast("مكتبة Excel ما تحمّلت، تأكد من الاتصال."); return; }
    try{ const wb=XLSX.read(await f.arrayBuffer(),{type:"array"}); let rows=[]; wb.SheetNames.forEach(n=>rows=rows.concat(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false})));
      const map=parseRosterRows(rows); Object.assign(Store.roster,map); Store.saveRoster(); toast("تمت إضافة "+Object.keys(map).length+" طالب من الملف"); render();
    }catch(err){ toast("تعذّرت قراءة الملف. جرّب حفظه بصيغة xlsx."); } });
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{UI.tab=b.dataset.tab;render();});
  document.querySelectorAll("[data-form]").forEach(b=>b.onclick=()=>{UI.form=+b.dataset.form;render();});
  document.querySelectorAll("[data-an]").forEach(b=>b.onclick=()=>{UI.anForm=+b.dataset.an;render();});
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
    const [i,o]=b.dataset.k.split(":").map(Number), ex=UI.exam, f=Math.min(UI.form,ex.nforms-1);
    ex.keys[f][i]= ex.keys[f][i]===o?-1:o;
    ex.results.forEach(r=>{ if(r.form===f) r.score=scoreOf(ex,f,r.ans); });
    render(); queueSave(ex);
  });
  if($("#sheetPrev")) renderSheet(UI.exam,4).then(cv=>{ const p=$("#sheetPrev"); if(!p) return; p.width=cv.width; p.height=cv.height; p.getContext("2d").drawImage(cv,0,0); });
  on("#dlSheet","click",async()=>{
    const cv=await renderSheet(UI.exam); const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
    try{ await DL.save({filename:"ورقة إجابة - "+UI.exam.name+".png", data:blob}); }catch(e){ if(e&&e.code!=="declined") toast("تعذّر التحميل."); }
  });
  on("#shot","change",e=>startScan([...e.target.files]));
  on("#many","change",e=>startScan([...e.target.files]));
  on("#manual","click",()=>{ const ex=UI.exam; UI.review={answers:Array(ex.nq).fill(-1), id:"", form:0, flags:0}; render(); });
  if(UI.review && UI.review.canvas && $("#ovl")) drawOverlay();
  on("#rId","input",e=>{ UI.review.id=toLatinDigits(e.target.value.trim()); });
  on("#rId","change",()=>render());
  on("#rForm","change",e=>{ UI.review.form=+e.target.value; UI.review.formBad=false; render(); });
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.a, R=UI.review, n=UI.exam.nopt; let a=R.answers[i]; a = a<0?0:(a+1>=n?-1:a+1); R.answers[i]=a; render(); });
  on("#saveRes","click",()=>{
    const ex=UI.exam, R=UI.review;
    if(!R.id || R.id.includes("?")){ toast("اكتب رقم الطالب كاملًا قبل الحفظ."); return; }
    const rec={sid:R.id, form:R.form, ans:R.answers.map(a=>a<0?-1:a), score:scoreOf(ex,R.form,R.answers), at:Date.now()};
    ex.results=ex.results.filter(r=>r.sid!==R.id); ex.results.push(rec); Store.saveExam(ex);
    toast(`تم حفظ ${sName(R.id)||R.id}: ${rec.score} / ${ex.nq}`); nextInQueue();
  });
  on("#skipRes","click",()=>nextInQueue());
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(!await confirmBox("حذف نتيجة الطالب "+b.dataset.del+"؟","حذف")) return;
    UI.exam.results=UI.exam.results.filter(r=>r.sid!==b.dataset.del); Store.saveExam(UI.exam); render(); });
  on("#xlsx","click",exportXlsx);
  on("#saveSet","click",()=>{
    const ex=UI.exam; ex.name=$("#sName").value.trim()||ex.name; ex.nq=+$("#sQ").value; ex.nopt=+$("#sOpt").value; ex.nforms=+$("#sF").value; ex.idDigits=+$("#sD").value;
    fixKeys(ex); ex.results.forEach(r=>{ r.ans=Array.from({length:ex.nq},(_,i)=>r.ans[i]??-1); if(r.form>=ex.nforms) r.form=0; r.score=scoreOf(ex,r.form,r.ans); });
    Store.saveExam(ex); toast("تم الحفظ"); render(); });
  on("#delExam","click",async()=>{ if(!await confirmBox("حذف الاختبار «"+UI.exam.name+"» وكل نتائجه؟ ما يمكن التراجع.","حذف نهائي")) return; await Store.deleteExam(UI.exam); UI.view="home"; render(); });
}
let saveTimer=null;
function queueSave(ex){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>Store.saveExam(ex),700); }
function toLatinDigits(s){ return String(s).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)); }

async function startScan(files){
  if(!files.length) return; UI.queue=files; nextInQueue();
}
async function nextInQueue(){
  UI.review=null;
  if(!UI.queue.length){ render(); return; }
  const file=UI.queue.shift(); const ex=UI.exam;
  $("#panel").innerHTML=`<div class="card"><p>جاري قراءة الورقة…</p></div>`;
  await new Promise(r=>setTimeout(r,30));
  try{
    const img=await fileToImage(file); const res=OMR.read(img, ex);
    if(!res.ok){ toast("ما قدرت ألقى المربعات السوداء الأربعة. صوّر الورقة كاملة بإضاءة أوضح."); nextInQueue(); return; }
    const flags=res.answers.filter(a=>a<0).length;
    UI.review={answers:res.answers, id:res.id, form:res.form<0?0:res.form, formBad:res.form<0, flags, canvas:res.G.canvas, H:res.H, L:res.L};
  }catch(e){ toast("تعذّرت قراءة الصورة."); nextInQueue(); return; }
  render();
}
function drawOverlay(){
  const R=UI.review, src=R.canvas, c=$("#ovl"); c.width=src.width; c.height=src.height; const g=c.getContext("2d"); g.drawImage(src,0,0);
  const ex=UI.exam, key=ex.keys[R.form]||[], s=Math.hypot(...[0,1].map(i=>applyH(R.H,100,100)[i]-applyH(R.H,101,100)[i]));
  g.lineWidth=Math.max(2,s*0.6);
  R.L.q.forEach((q,i)=>{ q.opts.forEach((b,o)=>{ const [x,y]=applyH(R.H,b.x,b.y); const a=R.answers[i];
    if(o===a){ g.strokeStyle= key[i]===o?"#16a34a":"#dc2626"; g.beginPath(); g.arc(x,y,b.r*s*1.3,0,7); g.stroke(); }
    else if(o===key[i] && a!==o){ g.strokeStyle="#16a34a"; g.setLineDash([s,s*0.8]); g.beginPath(); g.arc(x,y,b.r*s*1.3,0,7); g.stroke(); g.setLineDash([]); } }); });
}

async function exportXlsx(){
  const ex=UI.exam; if(!window.XLSX){ toast("مكتبة Excel ما تحمّلت، تأكد من الاتصال."); return; }
  const head=["رقم الطالب","الاسم","الفصل"]; if(ex.nforms>1) head.push("النموذج"); head.push("الدرجة","من","النسبة %");
  for(let i=1;i<=ex.nq;i++) head.push("س"+i);
  const rows=ex.results.slice().sort((a,b)=>a.sid.localeCompare(b.sid)).map(r=>{ const row=[r.sid, sName(r.sid), sCls(r.sid)]; if(ex.nforms>1) row.push(FORM_LET[r.form]);
    row.push(r.score, ex.nq, Math.round(r.score/ex.nq*1000)/10); r.ans.forEach(a=>row.push(a>=0?LET[a]:"")); return row; });
  const wb=XLSX.utils.book_new(); wb.Workbook={Views:[{RTL:true}]};
  const ws=XLSX.utils.aoa_to_sheet([head,...rows]); ws["!cols"]=[{wch:13},{wch:28}]; XLSX.utils.book_append_sheet(wb,ws,"النتائج");
  const an=[["السؤال", ...(ex.nforms>1?FORM_LET.slice(0,ex.nforms).map(l=>"مفتاح "+l):["المفتاح"]), "عدد من أجاب صح","نسبة الإجابة الصحيحة %", ...LET.slice(0,ex.nopt), "فارغ"]];
  itemStats(ex,-1).forEach((t,i)=>an.push([i+1, ...ex.keys.slice(0,ex.nforms).map(k=>k[i]>=0?LET[k[i]]:""), t.right, Math.round(t.pct*10)/10, ...t.counts, t.blank]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(an),"تحليل الأسئلة");
  const kk=[["السؤال",...FORM_LET.slice(0,ex.nforms).map(l=>"نموذج "+l)]]; for(let i=0;i<ex.nq;i++) kk.push([i+1,...ex.keys.slice(0,ex.nforms).map(k=>k[i]>=0?LET[k[i]]:"")]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(kk),"مفتاح الإجابة");
  const buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});
  try{ await DL.save({filename:"نتائج - "+ex.name+".xlsx", data:new Blob([buf])}); }catch(e){ if(e&&e.code!=="declined") toast("تعذّر التصدير."); }
}
